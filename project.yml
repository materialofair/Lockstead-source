name: Lockstead
options:
  bundleIdPrefix: zeronet
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.2.4"
configFiles:
  Debug: Config/Build.xcconfig
  Release: Config/Build.xcconfig
targets:
  Lockstead:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: Unlock Lockstead with Face ID instead of entering your PIN.
        ITSAppUsesNonExemptEncryption: false  # 仅用系统加密,免每次提交的出口合规问询
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zeronet.lockstead
        CODE_SIGN_ENTITLEMENTS: Entitlements/Lockstead.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: [AppIcon-Paper, AppIcon-Pebble, AppIcon-Calculator]
    dependencies:
      - target: ShieldConfigUI
      - target: ShieldAction
      - target: ActivityMonitor
  ShieldConfigUI:
    type: app-extension
    platform: iOS
    # 显式文件清单:扩展只编译实际用到的 Shared 子集,避免把换算表/StoreKit 相关代码
    # 全量编进扩展(体积、编译时间与未来框架依赖的污染面)
    sources:
      - path: Extensions/ShieldConfigUI
      - path: Shared/Localizable.xcstrings
        buildPhase: resources
      - path: Shared/AppGroup.swift
      - path: Shared/AppGroupStore.swift
      - path: Shared/GuardScene.swift
      - path: Shared/LockerState.swift
      - path: Shared/LockSchedule.swift
      - path: Shared/ShieldCopy.swift
      - path: Shared/XLPalette.swift
      - path: Shared/XLThemeCatalog.swift
      - path: Shared/XLThemeID.swift
    info:
      path: Extensions/ShieldConfigUI/Info.plist
      properties:
        CFBundleDisplayName: Lockstead
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zeronet.lockstead.shield-config
        CODE_SIGN_ENTITLEMENTS: Entitlements/ShieldConfigUI.entitlements
  ShieldAction:
    type: app-extension
    platform: iOS
    # 只关闭盾牌,不读 App Group、不写 ManagedSettings——一个 Shared 文件都不需要
    sources:
      - path: Extensions/ShieldAction
    info:
      path: Extensions/ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Lockstead
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zeronet.lockstead.shield-action
        CODE_SIGN_ENTITLEMENTS: Entitlements/ShieldAction.entitlements
  ActivityMonitor:
    type: app-extension
    platform: iOS
    # 只依赖状态持久化 + 三个调度器 + 限制计划,显式列出
    sources:
      - path: Extensions/ActivityMonitor
      - path: Shared/AppGroup.swift
      - path: Shared/AppGroupStore.swift
      - path: Shared/GuardScene.swift
      - path: Shared/LockerState.swift
      - path: Shared/LockSchedule.swift
      - path: Shared/LockScheduler.swift
      - path: Shared/TemporaryUnlockScheduler.swift
      - path: Shared/GuestModeScheduler.swift
      - path: Shared/RestrictionsController.swift
    info:
      path: Extensions/ActivityMonitor/Info.plist
      properties:
        CFBundleDisplayName: Lockstead
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ActivityMonitorExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zeronet.lockstead.activity-monitor
        CODE_SIGN_ENTITLEMENTS: Entitlements/ActivityMonitor.entitlements
  LocksteadTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/LocksteadTests]   # 不含 Shared——测试经 @testable import Lockstead 访问宿主类型,避免符号重复
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Lockstead
schemes:
  Lockstead:
    build:
      targets: { Lockstead: all }
    run:
      storeKitConfiguration: Lockstead.storekit
    test:
      targets: [LocksteadTests]
    archive:
      config: Release
      postActions:
        - name: Prepare Next Build Number
          settingsTarget: Lockstead
          script: /bin/sh "$SRCROOT/Scripts/increment-build-number.sh"
